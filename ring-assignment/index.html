<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ring Assignment</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-soft: #f5f7fa;
      --surface-muted: #e9edf2;
      --line: #c9d1db;
      --line-strong: #94a3b8;
      --text: #111827;
      --text-soft: #374151;
      --text-faint: #6b7280;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
      --radius: 16px;
      --good: #166534;
      --warn: #a16207;
      --danger: #b91c1c;
      --info: #334155;
      --idle: #475569;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(15, 23, 42, 0.08), transparent 28%),
        radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.06), transparent 35%),
        linear-gradient(180deg, #f4f6f8 0%, #eef1f4 18%, #e4e8ee 100%);
    }

    .shell { max-width: 1800px; margin: 0 auto; padding: 20px; }
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title-block, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .title-block {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 132px 46px 20px;
      min-height: 108px;
      background: linear-gradient(180deg, #fafbfc 0%, #eef2f6 100%);
    }

    .tournament-name {
      width: 100%;
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-weight: 750;
      color: var(--text);
      text-align: center;
    }

    .title-row {
      position: absolute;
      top: 16px;
      left: 20px;
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title-secondary {
      color: var(--text-soft);
      font-size: 21px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .title-meta {
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .banner-timer {
      position: absolute;
      left: 20px;
      bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .banner-timer strong { color: var(--text); }

    .title-logo {
      position: absolute;
      top: -1px;
      right: 1px;
      width: 108px;
      height: 108px;
      object-fit: contain;
      object-position: center;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
      padding: 4px;
    }

    .toolbar {
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-start;
      padding: 14px 16px;
    }

    .toolbar.panel { background: var(--surface); }

    button, a.btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button.primary, a.btn.primary { background: #111827; border-color: #111827; color: #fff; }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    button.ghost { background: var(--surface); }
    button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .notice {
      display: none !important;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-soft);
      font-size: 13px;
    }
    .notice.visible { display: block; }
    .notice.ok { border-color: rgba(22, 101, 52, 0.28); background: #ecfdf3; color: #14532d; }
    .notice.warn { border-color: rgba(161, 98, 7, 0.28); background: #fff7e0; color: #7c2d12; }
    .notice.error { border-color: rgba(185, 28, 28, 0.28); background: #fef2f2; color: #7f1d1d; }
    .notice.info { border-color: rgba(51, 65, 85, 0.28); background: #eef2f7; color: #1f2937; }

    .board {
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      gap: 14px;
      margin-bottom: 14px;
      align-items: start;
    }

    .division-pool,
    .ring-area {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #e5eaf2;
      background: linear-gradient(180deg, #fafbfc 0%, #f4f7fb 100%);
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .section-head .meta {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pool-controls {
      padding: 10px 12px 12px;
      border-bottom: 1px solid #e5eaf2;
      background: #fff;
    }

    .search-box {
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #fff;
      padding: 0 8px;
    }

    .search-box svg {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      color: var(--text-faint);
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: none;
      padding: 8px 0;
      font: inherit;
      color: var(--text);
      background: transparent;
    }

    .division-list {
      display: grid;
      gap: 8px;
      padding: 10px 12px 12px;
      max-height: min(66vh, 760px);
      overflow: auto;
    }

    .division-card {
      display: grid;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      padding: 9px 10px 8px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .division-card:hover {
      border-color: #8db4ff;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.10);
    }

    .division-card[aria-grabbed="true"] {
      opacity: 0.7;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18);
    }

    .division-card:focus-visible,
    .ring-row:focus-visible {
      outline: 3px solid rgba(29, 78, 216, 0.25);
      outline-offset: 2px;
    }

    .division-card-title {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.1;
    }

    .division-card-title .division-name {
      flex: 1 1 auto;
      min-width: 0;
    }

    .division-card-desc {
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.25;
    }

    .division-card[aria-disabled="true"] {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .ring-area {
      padding-bottom: 8px;
    }

    .ring-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 10px;
      padding: 14px 16px 16px;
      align-items: stretch;
    }

    .ring-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(86px, 110px) minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 12px 12px 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      height: 100%;
    }

    .ring-row::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: var(--ring-accent, var(--line));
    }

    .ring-row.drag-over {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16), 0 10px 24px rgba(15, 23, 42, 0.10);
    }

    .ring-row.idle { --ring-accent: var(--idle); }
    .ring-row.active { --ring-accent: var(--good); }
    .ring-row.waiting { --ring-accent: var(--warn); }
    .ring-row.down { --ring-accent: var(--danger); }

    .ring-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
      min-width: 0;
      padding-left: 4px;
    }

    .ring-meta-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .ring-number {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      line-height: 1;
    }

    .ring-number .label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .ring-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .ring-value {
      display: block;
      font-size: 13px;
      line-height: 1.25;
      color: var(--text);
      word-break: break-word;
    }

    .ring-card {
      min-width: 0;
      border-radius: 12px;
      border: 1px solid #e5eaf2;
      background: var(--surface-soft);
      padding: 8px 10px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .ring-card span {
      color: var(--text-faint);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 800;
    }

    .ring-card strong {
      display: block;
      font-size: 13px;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }

    .ring-card-inline {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .ring-card-inline strong {
      margin-left: 0;
      text-align: left;
      white-space: nowrap;
    }

    .ring-main {
      display: grid;
      gap: 6px;
      min-width: 0;
      width: 100%;
    }

    .ring-card.queue {
      padding-top: 7px;
      padding-bottom: 7px;
      width: 100%;
    }

    .ring-reset-button {
      appearance: none;
      border: 1px solid rgba(185, 28, 28, 0.28);
      background: #fff;
      color: var(--danger);
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }

    .ring-reset-button:hover {
      border-color: rgba(185, 28, 28, 0.45);
      background: #fff5f5;
    }

    .ring-reset-button:focus-visible {
      outline: 3px solid rgba(185, 28, 28, 0.16);
      outline-offset: 2px;
    }

    .ring-queue-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 6px;
    }

    .ring-queue-empty {
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.3;
    }

    .ring-queue-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      width: 100%;
      min-width: 0;
    }

    .ring-queue-chip .group-link {
      font-size: 12px;
    }

    .ring-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px 8px;
      color: var(--text-soft);
      font-size: 12px;
    }

    .ring-actions .tip {
      font-weight: 700;
    }

    .ring-action-button {
      border: 0;
      background: transparent;
      color: #1d4ed8;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 4px 8px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .status-chip.ok { background: #dcfce7; border-color: #86efac; color: #14532d; }
    .status-chip.warn { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
    .status-chip.down { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
    .status-chip.idle { background: #e5e7eb; border-color: #cbd5e1; color: #334155; }

    .group-link {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      color: #1d4ed8;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 700;
      font-size: 13px;
    }

    .queue-remove {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      padding: 0 2px 0 4px;
      cursor: pointer;
    }

    .empty {
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.3;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.5);
      z-index: 50;
    }

    .modal.visible { display: flex; }

    .modal-dialog {
      width: min(840px, 100%);
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 16px 18px;
      border-bottom: 1px solid #e5eaf2;
      background: #eef2f6;
    }

    .modal-title h3 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.2;
    }

    .modal-title .sub {
      color: var(--text-soft);
      font-size: 13px;
    }

    .modal-close {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    .modal-body {
      padding: 16px 18px 18px;
      display: grid;
      gap: 12px;
    }

    .modal-section {
      border: 1px solid #e5eaf2;
      border-radius: 14px;
      background: var(--surface-soft);
      padding: 12px 14px;
    }

    .modal-section h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .modal-section .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--text-soft);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .modal-section .meta-line span { white-space: nowrap; }

    .modal-list {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
      color: var(--text);
      font-size: 13px;
    }

    .foot {
      color: var(--text-soft);
      font-size: 12px;
      margin-top: 8px;
    }

    @media (max-width: 1240px) {
      .board { grid-template-columns: 1fr; }
      .ring-list { grid-template-columns: 1fr; }
      .ring-row { grid-template-columns: minmax(86px, 110px) minmax(0, 1fr) minmax(0, 1fr); }
      .ring-card.queue { grid-column: 1 / -1; }
    }

    @media (max-width: 780px) {
      .shell { padding: 14px; }
      .hero { grid-template-columns: 1fr; }
      .title-block { padding-right: 20px; padding-bottom: 56px; min-height: 0; }
      .title-logo { position: static; width: 88px; height: 88px; margin-top: 12px; }
      .banner-timer { left: 20px; bottom: 12px; }
      .ring-row { grid-template-columns: 1fr; }
      .ring-card.queue { grid-column: auto; }
      .modal-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div class="title-block">
        <h1 class="tournament-name" id="tournamentName">Tournament</h1>
        <div class="title-row">
          <div class="title-secondary">Ring Assignment</div>
          <div class="title-meta" id="competitorCountLabel">0 competitors</div>
        </div>
        <div class="banner-timer">Event Timer: <strong id="eventTimer">--:--:--</strong></div>
        <img class="title-logo" src="/assets/vaughns-dojang-logo.png" alt="Tournament logo">
      </div>
      <div class="toolbar panel">
        <a class="btn" href="/tournament-setup/event-definition/">Event Definition</a>
        <a class="btn" href="/head-table/">Head Table</a>
        <button id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div class="notice" id="notice" aria-live="polite"></div>
    <div class="board" id="board">
      <section class="division-pool" aria-labelledby="divisionPoolTitle">
        <div class="section-head">
          <h2 id="divisionPoolTitle">Division Pool</h2>
          <div class="meta" id="divisionPoolCount">0 divisions</div>
        </div>
        <div class="pool-controls">
          <label class="search-box" for="divisionSearchInput" aria-label="Search divisions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.5-3.5"></path>
            </svg>
            <input id="divisionSearchInput" type="search" placeholder="Search divisions..." autocomplete="off">
          </label>
        </div>
        <div class="division-list" id="divisionPoolList"></div>
      </section>

      <section class="ring-area" aria-labelledby="ringAssignmentTitle">
        <div class="section-head">
          <h2 id="ringAssignmentTitle">Ring Assignment</h2>
          <div class="meta" id="ringAssignmentMeta">0 rings</div>
        </div>
        <div class="ring-actions">
          <div class="tip">Tip: click a division, or drag it into a ring.</div>
        </div>
        <div class="ring-list" id="ringList"></div>
      </section>
    </div>
    <div class="foot">Click a group id for details. Use x to remove a group from a queue.</div>
  </div>

  <div class="modal" id="groupModal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
      <div class="modal-head">
        <div class="modal-title">
          <h3 id="groupModalTitle">Group details</h3>
          <div class="sub" id="groupModalSubtitle">Select a group</div>
        </div>
        <button class="modal-close" id="groupModalClose" aria-label="Close group details">×</button>
      </div>
      <div class="modal-body" id="groupModalBody"></div>
    </div>
  </div>

  <script>
    const state = {
      activeEvent: '',
      eventStartedAt: '',
      groups: [],
      rings: [],
      lastLoadedAt: null,
      heartbeatPolicy: { disconnectAfterSeconds: 90, resetMode: 'manual' },
      activeGroupId: '',
      searchQuery: '',
      draggedGroupId: ''
    };

    const noticeEl = document.getElementById('notice');
    const boardEl = document.getElementById('board');
    const divisionPoolListEl = document.getElementById('divisionPoolList');
    const divisionPoolCountEl = document.getElementById('divisionPoolCount');
    const ringListEl = document.getElementById('ringList');
    const ringAssignmentMetaEl = document.getElementById('ringAssignmentMeta');
    const divisionSearchInputEl = document.getElementById('divisionSearchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const tournamentNameEl = document.getElementById('tournamentName');
    const competitorCountLabelEl = document.getElementById('competitorCountLabel');
    const eventTimerEl = document.getElementById('eventTimer');
    const groupModalEl = document.getElementById('groupModal');
    const groupModalTitleEl = document.getElementById('groupModalTitle');
    const groupModalSubtitleEl = document.getElementById('groupModalSubtitle');
    const groupModalBodyEl = document.getElementById('groupModalBody');
    const groupModalCloseEl = document.getElementById('groupModalClose');

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return '0:00';
      var totalSeconds = Math.floor(ms / 1000);
      var hours = Math.floor(totalSeconds / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;
      if (hours > 0) {
        return hours + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }
      return minutes + ':' + String(seconds).padStart(2, '0');
    }

    function groupAnchor(group) {
      if (!group) return '';
      var divisionNumber = Number.parseInt(group.groupDivisionNumber, 10);
      if (Number.isFinite(divisionNumber)) return String(divisionNumber);
      return String(group.groupId || '').trim();
    }

    function groupById(groupId) {
      if (!groupId) return null;
      var normalized = String(groupId).trim();
      var numeric = Number.parseInt(normalized, 10);
      for (var i = 0; i < state.groups.length; i += 1) {
        var group = state.groups[i];
        if (Number.isFinite(numeric) && String(group.groupDivisionNumber) === String(numeric)) return group;
        if (group.groupId === normalized) return group;
      }
      return null;
    }

    function ringCurrentDivisionNumber(ring) {
      if (!ring) return '';
      return String(ring.groupDivisionNumber || '').trim();
    }

    function ringQueuedDivisionNumbers(ring) {
      if (!ring) return [];
      return Array.isArray(ring.queuedGroupDivisionNumbers) ? ring.queuedGroupDivisionNumbers : [];
    }

    function groupLabel(groupId) {
      var group = groupById(groupId);
      if (!group) return groupId || 'Unassigned';
      var anchor = groupAnchor(group);
      return anchor ? 'Division ' + anchor + ' - ' + group.name : (group.groupId + ' - ' + group.name);
    }

    function groupSummary(group) {
      var competitors = group && Array.isArray(group.competitors) ? group.competitors : [];
      var ages = competitors.map(function (competitor) {
        var storedAge = Number.parseInt(competitor.age, 10);
        if (Number.isFinite(storedAge) && storedAge > 0) return storedAge;

        var dob = String(competitor.dob || '').trim();
        if (!dob) return NaN;

        var birthDate = new Date(dob);
        if (!Number.isFinite(birthDate.getTime())) return NaN;

        var today = new Date();
        var age = today.getFullYear() - birthDate.getFullYear();
        var monthDiff = today.getMonth() - birthDate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
          age -= 1;
        }
        return age > 0 ? age : NaN;
      }).filter(Number.isFinite);
      var ranks = competitors.map(function (competitor) { return String(competitor.rank || competitor.rankCode || '').trim(); }).filter(Boolean);
      var genders = competitors.map(function (competitor) { return String(competitor.gender || '').trim(); }).filter(Boolean);
      var ageRange = 'Age unknown';
      var rankRange = 'Rank unknown';
      var gender = 'Unknown';
      var order = ['TTLD', 'G10', 'G9', 'G8', 'G7', 'G6', 'G5', 'G4', 'G3', 'G2', 'G1', 'CDB', 'D1', 'D2', 'D3'];

      if (ages.length) {
        var lo = Math.min.apply(null, ages);
        var hi = Math.max.apply(null, ages);
        ageRange = lo === hi ? 'Age ' + lo : 'Age ' + lo + '-' + hi;
      }

      var indexes = ranks.map(function (rank) { return order.indexOf(rank); }).filter(function (index) { return index >= 0; });
      if (indexes.length) {
        var rlo = Math.min.apply(null, indexes);
        var rhi = Math.max.apply(null, indexes);
        rankRange = rlo === rhi ? order[rlo] : order[rlo] + ' - ' + order[rhi];
      }

      if (genders.length) {
        var distinct = Array.from(new Set(genders));
        gender = distinct.length === 1 ? distinct[0] : 'Mixed';
      }

      return {
        count: competitors.length,
        ageRange: ageRange,
        rankRange: rankRange,
        gender: gender
      };
    }

    function heartbeatStatus(ring) {
      var ageMs = ring.lastHeartbeatAt ? Date.now() - new Date(ring.lastHeartbeatAt).getTime() : Number.POSITIVE_INFINITY;
      var threshold = state.heartbeatPolicy.disconnectAfterSeconds * 1000;
      var hasAssignment = !!ringCurrentDivisionNumber(ring) || ringQueuedDivisionNumbers(ring).length > 0;
      var hasTablet = !!ring.tabletLabel;

      if (!hasTablet) {
        return hasAssignment
          ? { label: 'Waiting', tone: 'waiting', chip: 'warn' }
          : { label: 'Unassigned', tone: 'idle', chip: 'idle' };
      }

      if (!Number.isFinite(ageMs) || ageMs < threshold) {
        return { label: hasAssignment ? 'Active' : 'Connected', tone: 'active', chip: 'ok' };
      }

      return {
        label: 'Disconnected',
        tone: 'down',
        chip: 'down'
      };
    }

    function buildRingView(ring) {
      var currentGroup = groupById(ringCurrentDivisionNumber(ring));
      var queuedDivisionNumbers = ringQueuedDivisionNumbers(ring);
      var status = heartbeatStatus(ring);
      var hasCurrent = !!ringCurrentDivisionNumber(ring);
      var hasQueue = queuedDivisionNumbers.length > 0;
      var statusLabel = !hasCurrent && !hasQueue
        ? 'Unassigned'
        : (!hasCurrent && hasQueue
          ? 'Waiting'
          : (status.label === 'Connected' ? 'Active' : status.label));
      var statusTone = !hasCurrent && !hasQueue
        ? 'idle'
        : (!hasCurrent && hasQueue
          ? 'waiting'
          : (status.label === 'Connected' ? 'ok' : status.chip));
      return {
        ring: ring,
        status: status,
        statusLabel: statusLabel,
        statusTone: statusTone,
        currentGroup: currentGroup
      };
    }

    function divisionDisplayData(group) {
      var summary = groupSummary(group);
      var anchor = groupAnchor(group);
      return {
        anchor: anchor,
        title: 'Division ' + anchor,
        descPrimary: summary.gender + ' ' + summary.rankRange,
        descSecondary: summary.ageRange,
        searchText: [anchor, group.name, summary.gender, summary.rankRange, summary.ageRange].join(' ').toLowerCase()
      };
    }

    function availableGroupsForPool() {
      var availableGroupDivisionNumbers = Array.isArray(state.availableGroupDivisionNumbers)
        ? state.availableGroupDivisionNumbers
        : [];
      var availableSet = new Set(availableGroupDivisionNumbers.map(function (value) { return String(value); }));
      var query = String(state.searchQuery || '').trim().toLowerCase();

      return state.groups
        .filter(function (group) {
          return availableSet.has(groupAnchor(group));
        })
        .filter(function (group) {
          if (!query) return true;
          return divisionDisplayData(group).searchText.indexOf(query) >= 0;
        })
        .sort(function (a, b) {
          return Number.parseInt(groupAnchor(a), 10) - Number.parseInt(groupAnchor(b), 10);
        });
    }

    function renderNotice(message, kind) {
      if (!message) {
        noticeEl.className = 'notice';
        noticeEl.textContent = '';
        return;
      }
      noticeEl.className = 'notice visible ' + (kind || 'info');
      noticeEl.textContent = message;
    }

    function renderGroupDetails(group) {
      if (!group) {
        return '<div class="modal-section"><h4>No group assigned</h4><div class="meta-line"><span>Nothing to show yet.</span></div></div>';
      }

      var competitors = Array.isArray(group.competitors) ? group.competitors : [];
      var list = competitors.length
        ? '<ol class="modal-list">' + competitors.map(function (competitor) {
            var firstName = String(competitor.firstName || '').trim();
            var lastName = String(competitor.lastName || '').trim();
            var rank = String(competitor.rank || competitor.rankCode || 'Unknown').trim();
            var age = String(competitor.age || '').trim() || 'Unknown';
            var studio = String(competitor.studio || competitor.school || '').trim() || 'Unknown';
            var name = [firstName, lastName].filter(Boolean).join(' ') || competitor.fullName || competitor.name || 'Unknown';
            return '<li>' + escapeHtml(name) + ' - ' + escapeHtml(rank) + ' - ' + escapeHtml(age) + ' - ' + escapeHtml(studio) + '</li>';
          }).join('') + '</ol>'
        : '<div class="meta-line"><span>No competitors in this group.</span></div>';

      return (
        '<div class="modal-section">' +
          list +
        '</div>'
      );
    }

    function openGroupModal(groupId) {
      state.activeGroupId = groupId;
      var group = groupById(groupId);
      groupModalTitleEl.textContent = group ? ('Division ' + groupAnchor(group)) : 'Group details';
      groupModalSubtitleEl.textContent = group ? (groupSummary(group).count + ' competitors') : 'Group not found';
      groupModalBodyEl.innerHTML = renderGroupDetails(group);
      groupModalEl.classList.add('visible');
      groupModalEl.setAttribute('aria-hidden', 'false');
    }

    function closeGroupModal() {
      state.activeGroupId = '';
      groupModalEl.classList.remove('visible');
      groupModalEl.setAttribute('aria-hidden', 'true');
      groupModalBodyEl.innerHTML = '';
    }

    function renderRingRow(ring) {
      var view = buildRingView(ring);
      var currentGroup = view.currentGroup;
      var queue = ringQueuedDivisionNumbers(ring);
      var queuedHtml = queue.length
        ? queue.map(function (groupId) {
            var label = groupLabel(groupId);
            return '<span class="ring-queue-chip"><button class="group-link" data-action="group-details" data-group-id="' + escapeHtml(groupId) + '">' + escapeHtml(label) + '</button><button class="queue-remove" data-action="remove-queue" data-ring-id="' + escapeHtml(ring.ringId) + '" data-group-id="' + escapeHtml(groupId) + '" aria-label="Remove ' + escapeHtml(label) + ' from queue">×</button></span>';
          }).join('')
        : '<span class="ring-queue-empty">No queued groups</span>';

      return [
        '<section class="ring-row ' + view.status.tone + '" data-ring-id="' + escapeHtml(ring.ringId) + '" tabindex="0" aria-label="Ring ' + escapeHtml(ring.ringLabel) + '">',
          '<div class="ring-meta">',
            '<div class="ring-number"><span class="label">Ring</span> ' + escapeHtml(ring.ringLabel) + '</div>',
            '<div class="ring-meta-actions">',
              '<span class="status-chip ' + view.status.chip + '">' + escapeHtml(view.status.label) + '</span>',
              '<button type="button" class="ring-reset-button" data-action="reset-ring" data-ring-id="' + escapeHtml(ring.ringId) + '">Reset ring</button>',
            '</div>',
          '</div>',
          '<div class="ring-main">',
            '<div class="ring-card active">',
              '<div class="ring-card-inline">',
                '<span>Active group</span>',
                '<strong>' + (currentGroup ? '<button class="group-link" data-action="group-details" data-group-id="' + escapeHtml(groupAnchor(currentGroup)) + '">' + escapeHtml('Division ' + groupAnchor(currentGroup)) + '</button>' : 'Unassigned') + '</strong>',
              '</div>',
            '</div>',
            '<div class="ring-card queue">',
              '<span>Queued groups</span>',
              '<div class="ring-queue-list">' + queuedHtml + '</div>',
            '</div>',
          '</div>',
        '</section>'
      ].join('');
    }

    function renderDivisionPool() {
      var groups = availableGroupsForPool();
      divisionPoolCountEl.textContent = groups.length + (groups.length === 1 ? ' division' : ' divisions');
      divisionPoolListEl.innerHTML = groups.length
        ? groups.map(function (group) {
            var display = divisionDisplayData(group);
            return [
              '<button type="button" class="division-card" draggable="true" data-group-id="' + escapeHtml(display.anchor) + '" aria-label="Assign ' + escapeHtml(display.title) + ' to a ring">',
                '<div class="division-card-title">',
                  '<span class="division-name">' + escapeHtml(display.title) + '</span>',
                '</div>',
                '<div class="division-card-desc">' + escapeHtml(display.descPrimary) + '</div>',
                '<div class="division-card-desc">' + escapeHtml(display.descSecondary) + '</div>',
              '</button>'
            ].join('');
          }).join('')
        : '<div class="empty">No available divisions match this search.</div>';
    }

    function renderRingArea() {
      var rings = state.rings.slice().sort(function (a, b) { return a.ringLabel.localeCompare(b.ringLabel); });
      ringAssignmentMetaEl.textContent = rings.length + (rings.length === 1 ? ' ring' : ' rings');
      ringListEl.innerHTML = rings.map(renderRingRow).join('');
    }

    function renderBoard() {
      tournamentNameEl.textContent = state.activeEvent || 'Tournament';
      competitorCountLabelEl.textContent = state.groups.reduce(function (sum, group) {
        return sum + (Array.isArray(group.competitors) ? group.competitors.length : 0);
      }, 0) + ' competitors';
      eventTimerEl.textContent = state.eventStartedAt ? fmtDuration(Date.now() - new Date(state.eventStartedAt).getTime()) : '--:--:--';
      var loadedAt = state.lastLoadedAt ? new Date(state.lastLoadedAt).toLocaleTimeString() : '--';
      noticeEl.dataset.loadedAt = loadedAt;

      renderDivisionPool();
      renderRingArea();

      if (state.activeGroupId) {
        var activeGroup = groupById(state.activeGroupId);
        if (activeGroup) {
          openGroupModal(activeGroup.groupId);
        } else {
          closeGroupModal();
        }
      } else {
        closeGroupModal();
      }
    }

    function updateTimerOnly() {
      eventTimerEl.textContent = state.eventStartedAt ? fmtDuration(Date.now() - new Date(state.eventStartedAt).getTime()) : '--:--:--';
    }

    async function fetchJson(url, options) {
      var response = await fetch(url, options);
      var data = await response.json();
      if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
      return data;
    }

    async function loadBoard() {
      var results = await Promise.all([
        fetchJson('/api/events/active'),
        fetchJson('/api/groups'),
        fetchJson('/api/rings')
      ]);

      state.activeEvent = results[0] && results[0].activeEvent ? String(results[0].activeEvent) : '';
      state.groups = results[1].groups || [];
      state.rings = results[2].rings || [];
      state.availableGroupDivisionNumbers = results[2].availableGroupDivisionNumbers || [];
      state.eventStartedAt = results[2].eventStartedAt || state.eventStartedAt || '';
      state.heartbeatPolicy = results[2].heartbeatPolicy || state.heartbeatPolicy;
      state.lastLoadedAt = new Date().toISOString();
      renderBoard();
      renderNotice('', '');
    }

    async function refreshAll() {
      try {
        await loadBoard();
      } catch (error) {
        renderNotice('Refresh failed: ' + error.message, 'error');
      }
    }

    async function queueGroup(ringId, groupId) {
      await fetchJson('/api/rings/' + ringId + '/queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groupDivisionNumber: groupId })
      });
    }

    async function removeQueuedGroup(ringId, groupId) {
      await fetchJson('/api/rings/' + ringId + '/queue/' + groupId, { method: 'DELETE' });
    }

    divisionSearchInputEl.addEventListener('input', function (event) {
      state.searchQuery = event.target.value || '';
      renderDivisionPool();
    });

    refreshBtn.addEventListener('click', function () {
      refreshAll().catch(function (error) { renderNotice(error.message, 'error'); });
    });

    boardEl.addEventListener('click', async function (event) {
      var button = event.target instanceof Element ? event.target.closest('button[data-action]') : null;
      if (!button) return;
      var action = button.getAttribute('data-action');
      var ringId = button.getAttribute('data-ring-id');
      var groupId = button.getAttribute('data-group-id');

      try {
        if (action === 'group-details') {
          openGroupModal(groupId);
          return;
        }
        if (action === 'reset-ring') {
          if (!confirm('Reset this ring? This clears the current group, queue, tablet, and assistance state.')) return;
          await fetchJson('/api/rings/' + ringId + '/reset', { method: 'POST' });
          await refreshAll();
          renderNotice('Ring reset complete.', 'ok');
          return;
        }
        if (action === 'remove-queue') {
          await removeQueuedGroup(ringId, groupId);
          await refreshAll();
          renderNotice('Queued group removed.', 'ok');
        }
      } catch (error) {
        renderNotice('Update failed: ' + error.message, 'error');
      }
    });

    boardEl.addEventListener('dragstart', function (event) {
      var card = event.target instanceof Element ? event.target.closest('.division-card') : null;
      if (!card) return;
      state.draggedGroupId = card.getAttribute('data-group-id') || '';
      card.setAttribute('aria-grabbed', 'true');
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', state.draggedGroupId);
      }
    });

    boardEl.addEventListener('dragend', function () {
      state.draggedGroupId = '';
      boardEl.querySelectorAll('.ring-row.drag-over').forEach(function (element) {
        element.classList.remove('drag-over');
      });
      boardEl.querySelectorAll('.division-card[aria-grabbed="true"]').forEach(function (element) {
        element.removeAttribute('aria-grabbed');
      });
    });

    boardEl.addEventListener('dragover', function (event) {
      var ringRow = event.target instanceof Element ? event.target.closest('.ring-row') : null;
      if (!ringRow) return;
      event.preventDefault();
      ringRow.classList.add('drag-over');
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    });

    boardEl.addEventListener('dragleave', function (event) {
      var ringRow = event.target instanceof Element ? event.target.closest('.ring-row') : null;
      if (!ringRow) return;
      if (!ringRow.contains(event.relatedTarget)) {
        ringRow.classList.remove('drag-over');
      }
    });

    boardEl.addEventListener('drop', async function (event) {
      var ringRow = event.target instanceof Element ? event.target.closest('.ring-row') : null;
      if (!ringRow) return;
      event.preventDefault();
      ringRow.classList.remove('drag-over');
      var ringId = ringRow.getAttribute('data-ring-id');
      var groupId = state.draggedGroupId || (event.dataTransfer && event.dataTransfer.getData('text/plain')) || '';
      if (!groupId) return;

      try {
        await queueGroup(ringId, groupId);
        await refreshAll();
        renderNotice('Division queued to ' + ringId + '.', 'ok');
      } catch (error) {
        renderNotice('Update failed: ' + error.message, 'error');
      } finally {
        state.draggedGroupId = '';
      }
    });
    refreshAll().catch(function (error) { renderNotice('Initial load failed: ' + error.message, 'error'); });
    window.setInterval(updateTimerOnly, 1000);
    window.setInterval(refreshAll, 10000);
  </script>
</body>
</html>
