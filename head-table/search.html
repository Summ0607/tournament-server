<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Competitor Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { margin-bottom: 10px; }
    label { display: inline-block; width: 150px; }
    input { font-size: 16px; padding: 6px; width: 240px; }
    button { font-size: 16px; padding: 6px 12px; margin-top: 8px; }
    table { margin-top: 20px; border-collapse: collapse; width: 100%; }
    th { background-color: #f2f2f2; padding: 8px; text-align: left; border-bottom: 2px solid #ccc; }
    td { padding: 6px; border-bottom: 1px solid #ddd; }
    tr:hover { background-color: #f9f9f9; }
  </style>
</head>
<body>
  <h1>Competitor Search</h1>
  <div class="row"><label for="firstName">First name</label><input id="firstName" type="text" placeholder="Prefix search"></div>
  <div class="row"><label for="lastName">Last name</label><input id="lastName" type="text" placeholder="Prefix search"></div>
  <div class="row"><label for="associationNumber">Association #</label><input id="associationNumber" type="text" placeholder="Exact match"></div>
  <div class="row"><label for="groupDivisionNumber">Group division #</label><input id="groupDivisionNumber" type="number" min="0" step="1" placeholder="Exact match"></div>
  <div class="row"><label for="rank">Rank</label><input id="rank" type="text" placeholder="Exact match"></div>
  <button id="searchBtn">Search</button>
  <table id="resultsTable" border="1" cellpadding="4" cellspacing="0"></table>

  <script>
    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');
    const associationNumber = document.getElementById('associationNumber');
    const groupDivisionNumber = document.getElementById('groupDivisionNumber');
    const rank = document.getElementById('rank');
    const searchBtn = document.getElementById('searchBtn');
    const resultsTable = document.getElementById('resultsTable');

    function runSearch() {
      const params = new URLSearchParams();
      if (firstName.value.trim()) params.set('firstName', firstName.value.trim());
      if (lastName.value.trim()) params.set('lastName', lastName.value.trim());
      if (associationNumber.value.trim()) params.set('associationNumber', associationNumber.value.trim());
      if (groupDivisionNumber.value.trim()) params.set('groupDivisionNumber', groupDivisionNumber.value.trim());
      if (rank.value.trim()) params.set('rank', rank.value.trim());

      if (!params.toString()) {
        resultsTable.innerHTML = '';
        return;
      }

      fetch(`/search?${params.toString()}`)
        .then((res) => res.json())
        .then((rows) => {
          resultsTable.innerHTML = '';
          if (!Array.isArray(rows) || rows.length === 0) {
            resultsTable.innerHTML = '<tr><td>No results found</td></tr>';
            return;
          }

          const headers = ['firstName', 'lastName', 'associationNumber', 'rank', 'groupDivisionNumber', 'weaponsDivision', 'hyungsDivision', 'sparringDivision', 'ringAssignment'];
          const headerRow = document.createElement('tr');
          headers.forEach((h) => {
            const th = document.createElement('th');
            th.textContent = h;
            headerRow.appendChild(th);
          });
          resultsTable.appendChild(headerRow);

          rows.forEach((row) => {
            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', () => {
              alert(`Selected competitor:\n${row.firstName} ${row.lastName}\nID: ${row.id}`);
            });
            headers.forEach((h) => {
              const td = document.createElement('td');
              td.textContent = row[h] ?? '';
              tr.appendChild(td);
            });
            resultsTable.appendChild(tr);
          });
        });
    }

    searchBtn.addEventListener('click', runSearch);
    [firstName, lastName, associationNumber, groupDivisionNumber, rank].forEach((input) => {
      input.addEventListener('input', runSearch);
    });
  </script>
</body>
</html>
