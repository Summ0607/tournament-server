<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Head Table Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-soft: #f5f7fa;
      --surface-muted: #e9edf2;
      --line: #c9d1db;
      --line-strong: #94a3b8;
      --text: #111827;
      --text-soft: #374151;
      --text-faint: #6b7280;
      --shadow: 0 10px 26px rgba(15, 23, 42, 0.10);
      --radius: 16px;
      --good: #166534;
      --warn: #a16207;
      --danger: #b91c1c;
      --info: #334155;
      --idle: #475569;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(15, 23, 42, 0.08), transparent 28%),
        radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.06), transparent 35%),
        linear-gradient(180deg, #f4f6f8 0%, #eef1f4 18%, #e4e8ee 100%);
    }

    .shell {
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title-block {
      position: relative;
      background: linear-gradient(180deg, #fafbfc 0%, #eef2f6 100%);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
      padding: 16px 132px 14px 20px;
      min-height: 108px;
    }

    .tournament-name {
      margin: 0 0 6px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-weight: 750;
      color: var(--text);
    }

    .title-secondary {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .title-logo {
      position: absolute;
      top: -1px;
      right: 1px;
      width: 108px;
      height: 108px;
      object-fit: contain;
      object-position: center;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
      padding: 4px;
    }

    .subtitle {
      color: #0f172a;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-start;
      padding: 14px 16px;
    }

    .toolbar.panel {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
    }

    button {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease, border-color 120ms ease;
    }

    button:hover { box-shadow: var(--shadow); }
    button:active { transform: translateY(1px); }
    button.primary { background: #111827; border-color: #111827; color: #fff; }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    button.ghost { background: var(--surface); }
    button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .hidden { display: none !important; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
    }

    .section-card {
      padding: 16px;
      margin-bottom: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .summary, .meta { display: none; }

    .summary-card {
      position: relative;
      padding: 14px;
      overflow: hidden;
    }

    .summary-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--card-accent, var(--line));
    }

    .summary-card strong {
      display: block;
      font-size: 28px;
      line-height: 1.05;
      margin-bottom: 6px;
    }

    .summary-card span {
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      font-weight: 800;
    }

    .summary-card.active { --card-accent: #0a7c00; }
    .summary-card.waiting { --card-accent: var(--warn); }
    .summary-card.down { --card-accent: var(--danger); }
    .summary-card.help { --card-accent: var(--info); }
    .summary-card.idle { --card-accent: var(--idle); }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      color: var(--text-soft);
      font-size: 13px;
      margin: 0 0 14px;
    }

    .meta span { white-space: nowrap; }

    .notice {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-soft);
      font-size: 13px;
    }

    .notice.visible { display: block; }
    .notice.ok { border-color: rgba(22, 101, 52, 0.28); background: #ecfdf3; color: #14532d; }
    .notice.warn { border-color: rgba(161, 98, 7, 0.28); background: #fff7e0; color: #7c2d12; }
    .notice.error { border-color: rgba(185, 28, 28, 0.28); background: #fef2f2; color: #7f1d1d; }
    .notice.info { border-color: rgba(51, 65, 85, 0.28); background: #eef2f7; color: #1f2937; }

    .board {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }

    .ring-card {
      position: relative;
      overflow: hidden;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .ring-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: var(--ring-accent, var(--line));
    }

    .ring-card.help-medical { --ring-accent: var(--danger); }
    .ring-card.help-arbitrator { --ring-accent: var(--warn); }
    .ring-card.help-general { --ring-accent: var(--info); }
    .ring-card.active { --ring-accent: var(--good); }
    .ring-card.waiting { --ring-accent: var(--warn); }
    .ring-card.down { --ring-accent: var(--danger); }
    .ring-card.idle { --ring-accent: var(--idle); }

    .ring-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ring-title {
      min-width: 0;
    }

    .ring-title h2 {
      margin: 0 0 4px;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      padding: 4px 8px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .chip.ok { background: #dcfce7; border-color: #86efac; color: #14532d; }
    .chip.warn { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
    .chip.down { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
    .chip.idle { background: #e5e7eb; border-color: #cbd5e1; color: #334155; }
    .chip.help { background: #e2e8f0; border-color: #cbd5e1; color: #1f2937; }
    .chip.phase { background: #e5e7eb; border-color: #cbd5e1; color: #334155; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      padding: 10px 11px;
      min-width: 0;
    }

    .stat span {
      display: block;
      color: var(--text-faint);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat strong {
      display: block;
      font-size: 14px;
      line-height: 1.25;
      color: var(--text);
      word-break: break-word;
    }

    .section-label {
      margin: 10px 0 6px;
      color: var(--text-faint);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .queue-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 6px;
    }

    .ring-row {
      display: grid;
      grid-template-columns: minmax(90px, 118px) minmax(0, 1fr) minmax(86px, 108px);
      gap: 10px;
      align-items: center;
    }

    .ring-id-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .ring-status {
      display: flex;
      align-items: center;
      min-height: 18px;
    }

    .ring-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #0f3da1;
      font: inherit;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .ring-link:hover { text-decoration-thickness: 2px; }

    .progress-box {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-soft);
      white-space: nowrap;
    }
    .status-chip.ok { background: #dcfce7; border-color: #86efac; color: #14532d; }
    .status-chip.warn { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
    .status-chip.down { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
    .status-chip.idle { background: #e5e7eb; border-color: #cbd5e1; color: #334155; }
    .status-chip.waiting { background: #fef3c7; border-color: #fcd34d; color: #78350f; }

    .progress-track {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .segment {
      position: relative;
      min-height: 16px;
    border: 1px solid var(--line-strong);
      border-radius: 8px;
      background:
      linear-gradient(90deg, rgba(51, 65, 85, 0.44) 0, rgba(51, 65, 85, 0.44) calc(var(--fill, 0) * 100%), #e5e7eb calc(var(--fill, 0) * 100%), #e5e7eb 100%);
      overflow: hidden;
    }

    .segment.complete {
      background:
      linear-gradient(90deg, rgba(22, 101, 52, 0.36) 0, rgba(22, 101, 52, 0.36) calc(var(--fill, 0) * 100%), #dcfce7 calc(var(--fill, 0) * 100%), #dcfce7 100%);
    }

    .segment.active {
      background:
      linear-gradient(90deg, rgba(22, 101, 52, 0.5) 0, rgba(22, 101, 52, 0.5) calc(var(--fill, 0) * 100%), #dcfce7 calc(var(--fill, 0) * 100%), #dcfce7 100%);
    }

    .segment.upcoming {
    background: #d1d5db;
    }

    .segment.warn {
      background:
      linear-gradient(90deg, rgba(185, 28, 28, 0.4) 0, rgba(185, 28, 28, 0.4) calc(var(--fill, 0) * 100%), #fee2e2 calc(var(--fill, 0) * 100%), #fee2e2 100%);
    }

    .segment span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .timer-box {
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100%;
    }

    .timer-box strong {
      display: block;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .timer-box small {
      display: block;
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 11px;
    }

    .event-timer {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-soft);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .event-timer strong {
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .ring-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.5);
      z-index: 50;
    }

    .ring-modal.visible { display: flex; }

    .ring-modal-dialog {
      width: min(840px, 100%);
      background: #fff;
      border-radius: 18px;
      border: 1px solid rgba(201, 209, 222, 0.9);
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }

    .ring-modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 16px 18px;
      border-bottom: 1px solid #e5eaf2;
      background: #f8fafc;
    }

    .ring-modal-title h3 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.2;
    }

    .ring-modal-title .sub {
      color: var(--text-soft);
      font-size: 13px;
    }

    .ring-modal-close {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    .ring-modal-body {
      padding: 16px 18px 18px;
      display: grid;
      gap: 12px;
    }

    .ring-modal-section {
      border: 1px solid #e5eaf2;
      border-radius: 14px;
      background: var(--surface-soft);
      padding: 12px 14px;
    }

    .ring-modal-section h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .ring-modal-section .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--text-soft);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .ring-modal-section .meta-line span {
      white-space: nowrap;
    }

    .ring-modal-list {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
      color: var(--text);
      font-size: 13px;
    }

    .queue-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #e5eaf2;
      background: #fff;
      font-size: 13px;
    }

    .empty {
      border: 1px dashed #d6dde7;
      background: var(--surface-soft);
      color: var(--text-soft);
      border-radius: 12px;
      padding: 10px 11px;
      font-size: 13px;
      font-style: italic;
    }

    .assist {
      margin-top: 10px;
      padding: 10px 11px;
      border-radius: 12px;
      border: 1px solid;
      display: grid;
      gap: 4px;
      font-size: 13px;
    }

    .assist.medical { background: #fff0f2; border-color: rgba(176, 0, 32, 0.22); color: #8c0018; }
    .assist.arbitrator { background: #f5efff; border-color: rgba(124, 77, 255, 0.22); color: #5a34aa; }
    .assist.general { background: #eef2f7; border-color: rgba(148, 163, 184, 0.4); color: #1f2937; }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e4eaf2;
    }

    .action-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .action-line.reset {
      grid-template-columns: 1fr;
    }

    .action-line select {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
    }

    .action-line button {
      min-width: 140px;
    }

    .action-line.reset button {
      min-width: 0;
      width: fit-content;
    }

    .status-panel {
      padding: 16px;
    }

    .status-panel-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .status-panel h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .status-state {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .status-state.ok { background: #e8f7e8; border-color: #bfe2bf; color: var(--good); }
    .status-state.error { background: #fff0f3; border-color: #f0b9c4; color: var(--danger); }
    .status-state.loading { background: #eef2f7; border-color: #cbd5e1; color: #334155; }

    .status-output {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 12px;
      border: 1px solid #e5eaf2;
      background: #0f172a;
      color: #e7edf8;
      padding: 14px;
      min-height: 160px;
      max-height: 360px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
    }

    .status-foot {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      color: var(--text-soft);
      font-size: 12px;
    }

    .status-flash {
      animation: flashPulse 280ms ease-out;
    }

    @keyframes flashPulse {
      from { box-shadow: 0 0 0 0 rgba(34, 87, 179, 0.28); }
      to { box-shadow: 0 0 0 14px rgba(34, 87, 179, 0); }
    }

    @media (max-width: 760px) {
      .shell { padding: 14px; }
      .toolbar { justify-content: flex-start; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board { grid-template-columns: 1fr; }
      .ring-row { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .action-line, .action-line.reset { grid-template-columns: 1fr; }
      .action-line button { width: 100%; min-width: 0; }
      .status-panel-head { align-items: flex-start; flex-direction: column; }
      .event-timer { margin-left: 0; }
      .timer-box { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div class="title-block">
        <h1 class="tournament-name" id="tournamentName">Tournament</h1>
        <div class="title-secondary">Head Table</div>
        <img class="title-logo" src="/assets/vaughns-dojang-logo.png" alt="Tournament logo">
      </div>
      <div class="toolbar panel">
        <button class="ghost" id="refreshBtn">Refresh Board</button>
        <button class="danger" id="resetTournamentBtn">Reset Tournament</button>
        <button class="ghost" id="openSetupBtn" onclick="location.href='/setup/'">Setup</button>
        <button class="ghost" id="openRingAssignmentBtn" onclick="location.href='/ring-assignment/'">Ring Assignment</button>
        <button class="ghost" id="debugToggleBtn">Show Debug</button>
        <div class="event-timer">Event Timer: <strong id="eventTimer">--:--:--</strong></div>
      </div>
    </div>

    <div class="summary" id="summaryCards"></div>
    <div class="meta" id="metaLine">Loading dashboard...</div>
    <div class="notice" id="notice" aria-live="polite"></div>

    <div class="panel status-panel hidden" id="statusPanel">
      <div class="status-panel-head">
        <h3>Debug Status</h3>
        <span class="status-state loading" id="statusState">Hidden</span>
      </div>
      <pre class="status-output" id="statusOutput">{}</pre>
      <div class="status-foot">
        <span id="statusTimestamp">Timestamp: --</span>
        <span id="statusError">Error state: --</span>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div class="ring-modal" id="ringModal" aria-hidden="true">
      <div class="ring-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="ringModalTitle">
        <div class="ring-modal-head">
          <div class="ring-modal-title">
            <h3 id="ringModalTitle">Ring details</h3>
            <div class="sub" id="ringModalSubtitle">Select a ring</div>
          </div>
          <button class="ring-modal-close" id="ringModalClose" aria-label="Close ring details">×</button>
        </div>
        <div class="ring-modal-body" id="ringModalBody"></div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      groups: [],
      rings: [],
      ringConfig: { letterCount: 1, numberCount: 2 },
      heartbeatPolicy: { disconnectAfterSeconds: 90, resetMode: 'manual' },
      serverBaseUrl: '',
      activeEvent: '',
      eventStartedAt: '',
      lastBoardLoadedAt: null,
      statusData: null,
      statusLoadedAt: null,
      statusError: '',
      debugVisible: false,
      activeRingId: ''
    };

    const summaryCardsEl = document.getElementById('summaryCards');
    const metaLineEl = document.getElementById('metaLine');
    const noticeEl = document.getElementById('notice');
    const boardEl = document.getElementById('board');
    const tournamentNameEl = document.getElementById('tournamentName');
    const statusPanelEl = document.getElementById('statusPanel');
    const statusOutputEl = document.getElementById('statusOutput');
    const statusStateEl = document.getElementById('statusState');
    const statusTimestampEl = document.getElementById('statusTimestamp');
    const statusErrorEl = document.getElementById('statusError');
    const eventTimerEl = document.getElementById('eventTimer');
    const ringModalEl = document.getElementById('ringModal');
    const ringModalTitleEl = document.getElementById('ringModalTitle');
    const ringModalSubtitleEl = document.getElementById('ringModalSubtitle');
    const ringModalBodyEl = document.getElementById('ringModalBody');
    const ringModalCloseEl = document.getElementById('ringModalClose');
    const refreshBtn = document.getElementById('refreshBtn');
    const resetTournamentBtn = document.getElementById('resetTournamentBtn');
    const debugToggleBtn = document.getElementById('debugToggleBtn');

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtTime(isoText) {
      if (!isoText) return '--';
      const date = new Date(isoText);
      if (Number.isNaN(date.getTime())) return '--';
      return date.toLocaleString();
    }

    function fmtAgo(isoText) {
      if (!isoText) return 'Unknown';
      const time = new Date(isoText).getTime();
      if (Number.isNaN(time)) return 'Unknown';
      const seconds = Math.max(0, Math.floor((Date.now() - time) / 1000));
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      return `${hours}h ${minutes % 60}m ago`;
    }

    function groupLabel(groupId) {
      if (!groupId) return 'Unassigned';
      const group = state.groups.find((item) => item.groupId === groupId);
      return group ? `${group.groupId} - ${group.name}` : groupId;
    }

    function heartbeatStatus(ring) {
      const ageMs = ring.lastHeartbeatAt ? Date.now() - new Date(ring.lastHeartbeatAt).getTime() : Number.POSITIVE_INFINITY;
      const threshold = state.heartbeatPolicy.disconnectAfterSeconds * 1000;
      const hasAssignment = !!ring.currentGroupId || (ring.queuedGroupIds || []).length > 0;
      const hasTablet = !!ring.tabletLabel;

      if (!hasTablet) {
        return hasAssignment
          ? { label: 'Waiting', tone: 'waiting', chip: 'warn', detail: 'Queued or assigned, waiting for tablet connection.' }
          : { label: 'Idle', tone: 'idle', chip: 'idle', detail: 'No tablet connected.' };
      }

      if (!Number.isFinite(ageMs) || ageMs < threshold) {
        return { label: 'Connected', tone: 'active', chip: 'ok', detail: fmtAgo(ring.lastHeartbeatAt) };
      }

      return {
        label: 'Disconnected',
        tone: 'down',
        chip: 'down',
        detail: hasAssignment
          ? 'Assignment preserved until reset.'
          : 'No recent heartbeat.'
      };
    }

    function ringTone(ring) {
      const assistanceType = String(ring.assistanceType || '').toLowerCase();
      if (assistanceType === 'medical') return 'help-medical';
      if (assistanceType === 'arbitrator') return 'help-arbitrator';
      if (assistanceType === 'general') return 'help-general';
      return heartbeatStatus(ring).tone;
    }

    function summaryCounts() {
      const counts = { active: 0, waiting: 0, down: 0, help: 0, idle: 0 };
      for (const ring of state.rings) {
        const health = heartbeatStatus(ring);
        if (health.label === 'Connected') counts.active += 1;
        else if (health.label === 'Waiting') counts.waiting += 1;
        else if (health.label === 'Disconnected') counts.down += 1;
        else counts.idle += 1;
        if (ring.assistanceType) counts.help += 1;
      }
      return counts;
    }

    function ringUnavailableIds(currentRingId) {
      const ids = new Set();
      for (const ring of state.rings) {
        if (ring.ringId === currentRingId) continue;
        if (ring.currentGroupId) ids.add(ring.currentGroupId);
        for (const gid of ring.queuedGroupIds || []) ids.add(gid);
      }
      return ids;
    }

    function availableGroupsForRing(ring) {
      const unavailable = ringUnavailableIds(ring.ringId);
      const currentAndQueue = new Set([ring.currentGroupId, ...(ring.queuedGroupIds || [])].filter(Boolean));
      return state.groups.filter((group) => !unavailable.has(group.groupId) || currentAndQueue.has(group.groupId));
    }

    function renderNotice(message, kind) {
      if (!message) {
        noticeEl.className = 'notice';
        noticeEl.textContent = '';
        return;
      }
      noticeEl.className = `notice visible ${kind || 'info'}`;
      noticeEl.textContent = message;
    }

    function formatAgeRange(group) {
      const ages = (group && Array.isArray(group.competitors) ? group.competitors : [])
        .map((competitor) => Number.parseInt(competitor.age, 10))
        .filter((age) => Number.isFinite(age));
      if (!ages.length) return 'Age unknown';
      const lo = Math.min.apply(null, ages);
      const hi = Math.max.apply(null, ages);
      return lo === hi ? `Age ${lo}` : `Age ${lo}-${hi}`;
    }

    function formatRankRange(group) {
      const ranks = (group && Array.isArray(group.competitors) ? group.competitors : [])
        .map((competitor) => String(competitor.rank || competitor.rankCode || '').trim())
        .filter(Boolean);
      if (!ranks.length) return 'Rank unknown';
      const order = ['TTLD', 'G10', 'G9', 'G8', 'G7', 'G6', 'G5', 'G4', 'G3', 'G2', 'G1', 'CDB', 'D1', 'D2', 'D3'];
      const indexes = ranks.map((rank) => order.indexOf(rank)).filter((index) => index >= 0);
      if (!indexes.length) return 'Rank unknown';
      const lo = Math.min.apply(null, indexes);
      const hi = Math.max.apply(null, indexes);
      return lo === hi ? order[lo] : `${order[lo]} - ${order[hi]}`;
    }

    function formatGender(group) {
      const genders = (group && Array.isArray(group.competitors) ? group.competitors : [])
        .map((competitor) => String(competitor.gender || '').trim())
        .filter(Boolean);
      if (!genders.length) return 'Unknown';
      const distinct = Array.from(new Set(genders));
      return distinct.length === 1 ? distinct[0] : 'Mixed';
    }

    function groupSummary(group) {
      return {
        count: group && Array.isArray(group.competitors) ? group.competitors.length : 0,
        ageRange: formatAgeRange(group),
        rankRange: formatRankRange(group),
        gender: formatGender(group)
      };
    }

    function getGroup(groupId) {
      if (!groupId) return null;
      return state.groups.find((group) => group.groupId === groupId) || null;
    }

    function elapsedMsForRing(ring) {
      const source = ring.assignmentStartedAt || ring.phaseStartedAt || ring.lastHeartbeatAt || state.eventStartedAt;
      if (!source) return 0;
      const time = new Date(source).getTime();
      if (Number.isNaN(time)) return 0;
      return Math.max(0, Date.now() - time);
    }

    function estimateMsForGroup(group) {
      const count = group && Array.isArray(group.competitors) ? group.competitors.length : 0;
      return Math.max(count, 1) * 7 * 60 * 1000;
    }

    function buildRingView(ring) {
      const currentGroup = getGroup(ring.currentGroupId);
      const queuedGroup = ring.queuedGroupIds && ring.queuedGroupIds.length ? getGroup(ring.queuedGroupIds[0]) : null;
      const hasCurrent = !!ring.currentGroupId;
      const hasQueue = (ring.queuedGroupIds || []).length > 0;
      const estimateMs = hasCurrent ? estimateMsForGroup(currentGroup) : 0;
      const elapsedMs = hasCurrent ? elapsedMsForRing(ring) : 0;
      const ratio = estimateMs > 0 ? elapsedMs / estimateMs : 0;
      const heartbeat = heartbeatStatus(ring);
      const statusLabel = !hasCurrent && !hasQueue
        ? 'Unassigned'
        : (!hasCurrent && hasQueue
          ? 'Waiting'
          : (heartbeat.label === 'Connected' ? 'Active' : heartbeat.label));
      const statusTone = !hasCurrent && !hasQueue
        ? 'idle'
        : (!hasCurrent && hasQueue
          ? 'waiting'
          : (heartbeat.label === 'Connected' ? 'ok' : heartbeat.chip));
      let tone = heartbeat.tone;
      if (hasCurrent && heartbeat.label === 'Connected') {
        if (ratio >= 1.2) tone = 'down';
        else if (ratio >= 1.1) tone = 'warn';
        else tone = 'active';
      }
      const detail = !hasCurrent
        ? (hasQueue ? `${groupLabel(ring.queuedGroupIds[0])}${ring.queuedGroupIds.length > 1 ? ` +${ring.queuedGroupIds.length - 1} more` : ''}` : 'No active or queued group.')
        : (heartbeat.label === 'Connected'
          ? (ratio >= 1.2 ? `Past estimate by ${fmtDuration(elapsedMs - estimateMs)}` : (ratio >= 1.1 ? `Near the edge by ${fmtDuration(elapsedMs - estimateMs)}` : 'Within estimate.'))
          : heartbeat.detail);
      const phasePlan = ring.phasePlan && Array.isArray(ring.phasePlan.phases) ? ring.phasePlan : { phases: [] };
      const phases = phasePlan.phases.length ? phasePlan.phases : defaultPhasePlan(ring, currentGroup);

      return {
        ring,
        tone,
        statusTone,
        statusLabel,
        detail,
        currentGroup,
        queuedGroup,
        hasCurrent,
        hasQueue,
        elapsedMs,
        estimateMs,
        elapsedText: hasCurrent ? fmtDuration(elapsedMs) : '--:--',
        estimateText: hasCurrent ? fmtDuration(estimateMs) : '--:--',
        phases
      };
    }

    function normalizePhaseFill(value) {
      const parsed = Number.parseFloat(value);
      if (!Number.isFinite(parsed) || parsed <= 0) return 0;
      if (parsed <= 1) return Math.max(0, Math.min(1, parsed));
      return Math.max(0, Math.min(100, parsed)) / 100;
    }

    function phaseFillForSegment(phase) {
      if (!phase) return 0;
      if (phase.state === 'complete') return 1;
      if (phase.state !== 'active') return 0;

      const explicitFill = normalizePhaseFill(phase.progress);
      if (explicitFill > 0) return explicitFill;

      const completed = Number.parseFloat(phase.completedCount);
      const total = Number.parseFloat(phase.totalCount);
      if (Number.isFinite(completed) && Number.isFinite(total) && total > 0) {
        return Math.max(0, Math.min(1, completed / total));
      }

      return 0;
    }

    function defaultPhasePlan(ring, group) {
      const phaseNames = ['setup', 'weapons', 'hyungs', 'sparring', 'awards'];
      const visible = [];
      const plan = ring.phasePlan && ring.phasePlan.phases ? ring.phasePlan.phases : [];
      if (plan.length) return plan;
      phaseNames.forEach((key) => {
        visible.push({ key, label: key.charAt(0).toUpperCase() + key.slice(1), state: 'idle', progress: 0 });
      });
      return visible;
    }

    function fmtDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return '0:00';
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function renderRingDetails(title, group) {
      if (!group) {
        return `<div class="ring-modal-section"><h4>${escapeHtml(title)}</h4><div class="meta-line"><span>No group assigned</span></div></div>`;
      }

      const competitors = Array.isArray(group.competitors) ? group.competitors : [];
      const competitorList = competitors.length
        ? `<ol class="ring-modal-list">${competitors.map((competitor) => `<li>${escapeHtml(competitor.fullName || competitor.name || 'Unknown')} — ${escapeHtml(String(competitor.rank || competitor.rankCode || 'Unknown'))}</li>`).join('')}</ol>`
        : '<div class="meta-line"><span>No competitors in this group.</span></div>';

      return `
        <div class="ring-modal-section">
          <h4>${escapeHtml(title)}: ${escapeHtml(group.groupId)} - ${escapeHtml(group.name || group.groupId)}</h4>
          ${competitorList}
        </div>
      `;
    }

    function renderRingModal(view) {
      if (!state.activeRingId || !view) {
        ringModalEl.classList.remove('visible');
        ringModalEl.setAttribute('aria-hidden', 'true');
        ringModalBodyEl.innerHTML = '';
        return;
      }

      const currentGroup = view.currentGroup;
      const queuedGroup = view.queuedGroup;
      ringModalTitleEl.textContent = `${view.ring.ringLabel} details`;
      ringModalSubtitleEl.textContent = `${view.ring.ringId} • ${view.statusLabel}`;
      ringModalBodyEl.innerHTML = [
        `<div class="ring-modal-section"><h4>Ring status</h4><div class="meta-line"><span>${escapeHtml(view.statusLabel)}</span><span>${escapeHtml(view.elapsedText)} elapsed</span><span>${escapeHtml(view.estimateText)} est</span></div></div>`,
        renderRingDetails('Active group', currentGroup),
        renderRingDetails('Queued group', queuedGroup)
      ].join('');
      ringModalEl.classList.add('visible');
      ringModalEl.setAttribute('aria-hidden', 'false');
    }

    function openRingDetails(ringId) {
      state.activeRingId = ringId;
      renderBoard();
    }

    function closeRingDetails() {
      state.activeRingId = '';
      renderBoard();
    }

    function renderBoard() {
      tournamentNameEl.textContent = state.activeEvent || 'Tournament';
      const loadedAt = state.lastBoardLoadedAt ? new Date(state.lastBoardLoadedAt).toLocaleTimeString() : '--';
      metaLineEl.innerHTML = `<span>Last board refresh: ${escapeHtml(loadedAt)}</span>`;
      eventTimerEl.textContent = state.eventStartedAt ? fmtDuration(Date.now() - new Date(state.eventStartedAt).getTime()) : '--:--:--';

      const rings = [...state.rings].sort((a, b) => a.ringLabel.localeCompare(b.ringLabel));
      boardEl.innerHTML = rings.map((ring) => {
        const view = buildRingView(ring);
        const statusLabel = view.hasCurrent ? view.statusLabel : (view.hasQueue ? 'Waiting' : 'Unassigned');
        const timeValue = view.hasCurrent ? view.elapsedText : '--:--';
        const estValue = view.hasCurrent ? view.estimateText : '--:--';
        const phases = Array.isArray(view.phases) ? view.phases : [];

          return `
            <section class="ring-card ${view.tone}" data-ring-id="${escapeHtml(ring.ringId)}">
              <div class="ring-row">
                <div class="ring-id-cell">
                  <button class="ring-link" data-action="open-ring" data-ring-id="${escapeHtml(ring.ringId)}">${escapeHtml(ring.ringLabel)}</button>
                  <div class="ring-status"><span class="status-chip ${view.statusTone}">${escapeHtml(statusLabel)}</span></div>
                </div>
                <div class="progress-box">
                  <div class="progress-track">
                    ${phases.map((phase) => `<div class="segment ${phase.state}" style="--fill:${phaseFillForSegment(phase).toFixed(3)}"><span>${escapeHtml(phase.label)}</span></div>`).join('')}
                  </div>
                </div>
                <div class="timer-box">
                  <strong>${escapeHtml(timeValue)}</strong>
                  <small>EST ${escapeHtml(estValue)}</small>
                </div>
              </div>
            </section>
          `;
      }).join('');

      if (state.activeRingId) {
        const activeRing = state.rings.find((ring) => ring.ringId === state.activeRingId);
        if (activeRing) {
          renderRingModal(buildRingView(activeRing));
        } else {
          closeRingDetails();
        }
      } else {
        renderRingModal(null);
      }
    }
    function renderStatusPanel(ok, message) {
      if (ok) {
        statusStateEl.textContent = 'OK';
        statusStateEl.className = 'status-state ok';
        statusErrorEl.textContent = 'Error state: none';
      } else {
        statusStateEl.textContent = 'ERROR';
        statusStateEl.className = 'status-state error';
        statusErrorEl.textContent = `Error state: ${message}`;
      }
      statusTimestampEl.textContent = `Timestamp: ${state.statusLoadedAt ? new Date(state.statusLoadedAt).toLocaleString() : '--'}`;
      statusOutputEl.textContent = state.statusData ? JSON.stringify(state.statusData, null, 2) : '{}';
      statusPanelEl.classList.remove('status-flash');
      void statusPanelEl.offsetWidth;
      statusPanelEl.classList.add('status-flash');
      window.setTimeout(() => statusPanelEl.classList.remove('status-flash'), 300);
    }

    function applyDebugVisibility() {
      statusPanelEl.classList.toggle('hidden', !state.debugVisible);
      debugToggleBtn.textContent = state.debugVisible ? 'Hide Debug' : 'Show Debug';
      if (state.debugVisible) {
        loadStatus().catch((error) => renderStatusPanel(false, error.message));
      }
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    async function loadDashboard() {
      const [activeResult, groupsResult, ringsResult] = await Promise.all([
        fetchJson('/api/events/active'),
        fetchJson('/api/groups'),
        fetchJson('/api/rings')
      ]);

      state.activeEvent = activeResult && activeResult.activeEvent ? String(activeResult.activeEvent) : '';
      state.groups = groupsResult.groups || [];
      state.rings = ringsResult.rings || [];
      state.serverBaseUrl = ringsResult.serverBaseUrl || location.origin;
      state.ringConfig = ringsResult.ringConfig || state.ringConfig;
      state.heartbeatPolicy = ringsResult.heartbeatPolicy || state.heartbeatPolicy;
      state.eventStartedAt = ringsResult.eventStartedAt || state.eventStartedAt || '';
      state.lastBoardLoadedAt = new Date().toISOString();
      renderBoard();
    }

    async function loadStatus() {
      try {
        const status = await fetchJson('/status');
        state.statusData = status;
        state.statusLoadedAt = new Date().toISOString();
        state.statusError = '';
        renderStatusPanel(true, '');
      } catch (error) {
        state.statusData = { error: error.message };
        state.statusLoadedAt = new Date().toISOString();
        state.statusError = error.message;
        renderStatusPanel(false, error.message);
      }
    }

    async function refreshAll() {
      try {
        await loadDashboard();
      } catch (error) {
        renderNotice(`Dashboard refresh failed: ${error.message}`, 'error');
      }

      if (state.debugVisible) {
        try {
          await loadStatus();
        } catch (error) {
          renderStatusPanel(false, error.message);
        }
      }
    }

    async function mutateRing(ringId, action, groupId) {
      if (action === 'queue') {
        const select = document.getElementById(`queue-${ringId}`);
        const nextGroupId = groupId || (select && select.value);
        if (!nextGroupId) throw new Error('Select a group to queue first.');
        await fetchJson(`/api/rings/${ringId}/queue`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groupId: nextGroupId })
        });
        return;
      }

      if (action === 'dequeue') {
        await fetchJson(`/api/rings/${ringId}/queue/${groupId}`, { method: 'DELETE' });
        return;
      }

      if (action === 'clear-assistance') {
        await fetchJson(`/api/rings/${ringId}/assistance/clear`, { method: 'POST' });
        return;
      }

      if (action === 'reset-ring') {
        if (!confirm(`Reset ${ringId}? This clears the current group, queue, tablet, and assistance state.`)) return;
        await fetchJson(`/api/rings/${ringId}/reset`, { method: 'POST' });
      }
    }

    refreshBtn.addEventListener('click', () => {
      refreshAll().catch((error) => renderNotice(error.message, 'error'));
    });

    boardEl.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('button[data-action="open-ring"]') : null;
      if (!link) return;
      const ringId = link.getAttribute('data-ring-id');
      if (!ringId) return;
      event.preventDefault();
      openRingDetails(ringId);
    });

    ringModalCloseEl.addEventListener('click', closeRingDetails);
    ringModalEl.addEventListener('click', (event) => {
      if (event.target === ringModalEl) closeRingDetails();
    });

    debugToggleBtn.addEventListener('click', () => {
      state.debugVisible = !state.debugVisible;
      applyDebugVisibility();
    });

    resetTournamentBtn.addEventListener('click', async () => {
      if (!confirm('Reset the tournament? This clears all ring assignments and queues.')) return;
      try {
        renderNotice('Resetting tournament...', 'warn');
        await fetchJson('/api/reset', { method: 'POST' });
        await refreshAll();
        renderNotice('Tournament reset complete.', 'ok');
      } catch (error) {
        renderNotice(`Reset failed: ${error.message}`, 'error');
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.activeRingId) {
        closeRingDetails();
        return;
      }
      if (event.key === 'F12') {
        event.preventDefault();
        state.debugVisible = !state.debugVisible;
        applyDebugVisibility();
      }
    });

    applyDebugVisibility();
    refreshAll().catch((error) => renderNotice(`Initial load failed: ${error.message}`, 'error'));

    window.setInterval(() => {
      renderBoard();
    }, 1000);
    window.setInterval(refreshAll, 10000);
  </script>
</body>
</html>
