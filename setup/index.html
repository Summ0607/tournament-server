<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/event-administration/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Retired</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, #f4f6fb 100%);
      color: #17212f;
    }

    .card {
      max-width: 640px;
      margin: 24px;
      padding: 28px;
      border-radius: 18px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(201, 209, 222, 0.85);
      box-shadow: 0 10px 28px rgba(24, 39, 75, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #5d6979;
      line-height: 1.55;
      font-size: 15px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #111827;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Setup has moved</h1>
    <p>The old Setup page has been retired. Event administration now lives on the dedicated Event Definition page.</p>
    <a href="/event-administration/">Go to Event Definition</a>
  </div>
</body>
</html>
